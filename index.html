<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1018" />
    <title>Junrey Ducay | Microsoft 365 &amp; Business Applications Developer</title>
    <meta
      name="description"
      content="Junrey Ducay is a Microsoft 365 & Business Applications Developer with 8+ years of experience in SharePoint, Power Platform, enterprise applications, and workflow automation."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Junrey Ducay | Microsoft 365 & Business Applications Developer"
    />
    <meta
      property="og:description"
      content="Reliable business applications. Thoughtful automation. Explore Junrey's experience and project portfolio."
    />
    <meta property="og:image" content="__SOCIAL_IMAGE__" />
    <meta
      property="og:image:alt"
      content="Junrey Ducay — Microsoft 365 & Business Applications Developer"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__SOCIAL_IMAGE__" />
    __CANONICAL__
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('jd-theme') === 'light' ? 'light' : 'dark'
        document.querySelector('meta[name="theme-color"]').content =
          document.documentElement.dataset.theme === 'light' ? '#f6f8fb' : '#0b1018'
      } catch {
        /* Dark is the default when storage is unavailable. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
